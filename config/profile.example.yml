# BizBuyBot Buyer Profile
# Copy this file to config/profile.yml and customize with your details.
# config/profile.yml is gitignored — your personal data stays local.

# --- Identity ---
identity:
  name: "Your Name"
  role: "Searcher / Acquirer"
  background: "Brief description of your professional background and relevant experience"

# --- Financial Capacity ---
financial:
  budget_range:
    min: 100000      # Minimum total deal size you're considering (USD)
    max: 1000000     # Maximum total deal size you're considering (USD)
  cash_down_payment: 150000  # Liquid cash available for down payment (USD)
  financing_approach: "SBA 7(a)"  # SBA 7(a), conventional, seller-financed, all-cash
  pre_qualified: false         # Have you been pre-qualified by an SBA lender?
  max_dscr_target: 1.4          # Minimum Debt Service Coverage Ratio you'll accept

# --- Skills & Experience ---
skills:
  industries: []           # e.g. ["HVAC", "commercial cleaning", "laundromat"]
  management_experience: 0      # Years managing or owning a business
  technical_skills: []    # e.g. ["sales", "operations", "bookkeeping", "digital marketing"]
  certifications: []      # e.g. ["EPA 608", "journeyman plumber", "food safety"]

# --- Geography & Lifestyle ---
geography:
  preferred_states: []        # e.g. ["TX", "FL", "NC"]
  preferred_metro: []         # e.g. ["Austin, TX", "Tampa, FL"]
  open_to_relocate: false     # false by default; only set true if you'll consider deals outside preferred_metro
  max_search_radius_miles: null   # how far outside preferred_metro you'll go, in miles (0 = metro only). Ignored when open_to_relocate is false.
  max_commute_minutes: 60

# --- Industry Preferences ---
industries:
  preferred: []        # e.g. ["laundromat", "car wash", "HVAC", "plumbing"]
  excluded: []         # e.g. ["food service", "adult entertainment"]
  involvement_level: "full-time owner-operator"  # full-time owner-operator | semi-absentee | investor

# --- Deal Criteria ---
deal_criteria:
  target_asking_price_range:
    min: 200000
    max: 750000
  target_sde_range:
    min: 75000      # Setup proposes min ≈ 50% of the typical SDE for your chosen industries; guardrailed so it never filters out a whole category (see templates/benchmarks.yml)
    max: 300000
  max_multiple: 4.0         # Maximum SDE multiple you'll consider (setup proposes the top category's sde_multiple_max)
  min_cash_flow_margin: 0.15  # Minimum SDE as % of gross revenue (setup proposes the category's typical_sde_margin low end)
  requires_real_estate: false  # Must the deal include owned real estate?
  max_employee_count: 25     # Maximum number of employees
